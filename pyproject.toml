[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gwprov"
dynamic = ["version"]
description = "Reusable provisioning and control tools for Game & Watch devices and GWemu"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
dependencies = ["gnwmanager", "pyelftools>=0.29", "rich>=14.1,<16",
                "rich-argparse>=1.8,<2", "PyYAML>=6", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
device = ["gnwmanager", "pyocd>=0.35.1", "PyFatFS>=1.1"]
remote = ["websockets>=14,<16"]
reports = ["reportlab>=4,<5"]
media = ["littlefs-python>=0.9", "pyfatfs>=1.1", "setuptools<81"]
dist = ["wasmtime>=20"]

[dependency-groups]
dev = [
    "black>=24.10",
    "coverage[toml]>=7.6",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[project.scripts]
gwprov = "gwprov.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["gwprov"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["gwprov/vendor"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "gwprov/vendor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["gwprov"]
omit = ["gwprov/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
