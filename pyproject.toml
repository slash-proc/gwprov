[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gwprov"
dynamic = ["version"]
description = "Reusable provisioning and control tools for Game & Watch devices and GWemu"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
dependencies = ["gnwmanager", "pyelftools>=0.29", "rich>=14.1,<16",
                "rich-argparse>=1.8,<2", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
device = ["gnwmanager", "pyocd>=0.35.1", "PyFatFS>=1.1"]
remote = ["websockets>=14,<16"]
reports = ["reportlab>=4,<5"]
media = ["littlefs-python>=0.9", "PyYAML>=6", "pyfatfs>=1.1", "setuptools<81"]
dist = ["wasmtime>=20"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
gwprov = "gwprov.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["gwprov"]

[tool.ruff]
line-length = 100
target-version = "py310"
